# /warez/vidiotic/ — the block this whole staging rig exists to produce.
#
# This file is the deliverable. It is written to be lifted verbatim into webb's
# `ansible/roles/nginx/templates/vhost.conf.j2`, next to the `location
# /warez/basalt/` block it is modelled on, and it is exercised here first so
# that "it works" is an observation rather than a hope.
#
# ── Why a block at all ────────────────────────────────────────────────────────
#
# The site-wide policy is `default-src 'self'; script-src 'self'
# 'wasm-unsafe-eval'; ... img-src 'self' data:`. Under it, /play does not
# degrade — it does not run. Three separate stops, each verified in this
# container:
#
#   1. the boot script is inline, and there is no 'unsafe-inline'. Nothing
#      executes; the page is a header and a paragraph.
#   2. audio capture builds its AudioWorklet from `URL.createObjectURL(new
#      Blob([...]))`. Worklet module scripts are fetched under `script-src`,
#      which does not admit blob:. The Listen button throws.
#   3. clip ingest hands the dropped file to a `<video>` as a blob: URL to bake
#      it. `media-src` is unset and inherits `default-src 'self'`, so the
#      element errors and every drop reports "this browser cannot decode it" —
#      a message that blames the browser for a decision made in this file.
#
# (1) is fixed in the page, not here: no 'unsafe-inline' appears below, because
# fubarchitect's rule is external scripts and /play now obeys it. (2) and (3)
# are genuine capability grants and are what the block is for.
#
# ── What is proven, and what is only reasoned ─────────────────────────────────
#
# (1) and (3) are demonstrated: `scripts/stage-fubar.sh --strict` plus the
# browser smoke fails on exactly those and passes once this block is in place.
#
# (2) is not. `play-smoke.mjs` drives the analyser through `push_audio` with a
# synthesised tone, because `getDisplayMedia` needs a consent prompt no headless
# run can answer — so the worklet is never actually constructed under a policy.
# The blob: in script-src and the microphone= grant below are read off the code
# in web/boot.js, not observed. Confirming them costs one human click on
# "Listen" against the staging container, and until somebody does that they are
# the least certain lines in this file.
#
# ── Why the header set is repeated ────────────────────────────────────────────
#
# Same reason as /warez/basalt/: one `add_header` in a location discards every
# `add_header` inherited from the server block, `always` included. Omit them and
# this path silently loses HSTS, nosniff and X-Frame-Options — the CSP would be
# right and everything around it gone.
location /warez/vidiotic/ {
    limit_req zone=general burst=40 nodelay;
    try_files $uri $uri/ =404;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;

    # `microphone=()` site-wide is a flat denial, and it outranks any prompt:
    # `getUserMedia({audio})` rejects without ever asking. That is the fallback
    # path when a visitor declines tab-audio sharing, so on the live policy the
    # Listen button has no working route at all.
    #
    # `display-capture` is deliberately not listed. Unlisted features keep their
    # own default allowlist, which for display-capture is already 'self';
    # naming it would change nothing except to imply it had been broken.
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(self)"  always;

    # blob: appears exactly twice, for the two capabilities named above:
    #   script-src — the AudioWorklet module
    #   media-src  — the <video> element that bakes a dropped clip
    # Everything else is tighter than the site default: 'none' for objects and
    # frame-ancestors, and no 'unsafe-inline' for scripts.
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}

# The bundle directory is named after a hash of its own contents, so its URL
# changes whenever its bytes do and it can be cached forever. This is the only
# reason a 6.6 MB module is tolerable on a personal site: it is downloaded once
# per build, not once per visit.
#
# It needs its own block because the site's aggressive-caching rule lives in a
# nested location under `location /`, and a prefix match on /warez/vidiotic/
# never reaches it. Without this, the wasm is served with no Cache-Control at
# all and revalidated on every load.
location ~ ^/warez/vidiotic/pkg-[0-9a-f]+/ {
    limit_req zone=general burst=40 nodelay;
    access_log off;

    # 6.6 MB -> 2.8 MB. `application/wasm` is not in the site's `gzip_types`, so
    # without this the module is served raw; adding it to that list instead
    # would compress a 6.6 MB body per request, at level 6, on a 1-vCPU box.
    #
    # `gzip_static` does neither: it serves the `.gz` that release-play.sh
    # already built at -9 and verified by round-tripping it. Debian's nginx is
    # compiled --with-http_gzip_static_module, so this needs nothing installed.
    #
    # The `.br` beside it (2.2 MB) stays unused — ngx_brotli is a separate
    # module and is not on the box. Worth 600 KB if it ever is.
    gzip_static on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Cache-Control             "public, max-age=31536000, immutable"           always;
}

# index.html names the bundle directory, so it is the one file that must never
# be stale: a cached copy pointing at a swept-away bundle is a page that boots
# into a 404 and stays that way until the visitor hard-reloads.
location = /warez/vidiotic/index.html {
    limit_req zone=general burst=40 nodelay;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=(self)"  always;
    add_header Cache-Control             "no-cache"                                      always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
}

# `release-play.sh` emits deploy metadata beside the site: a generated nginx.conf
# for a VPS that serves /play at the root, and a `_headers` file for Netlify and
# Cloudflare. Neither is used here — the warez is copied verbatim by the SSG and
# served by *this* config — and neither is anybody's business.
location ~ ^/warez/vidiotic/(nginx\.conf|_headers)$ {
    return 404;
}
