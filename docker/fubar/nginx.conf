# Main nginx config for the fubarchitect staging container.
#
# This is a transcription of webb's `ansible/roles/nginx/templates/nginx.conf.j2`
# — the file that actually runs on the DigitalOcean box — with only the changes
# Alpine and localhost force. Every deviation is marked DEVIATION and justified,
# because an unmarked one turns this container from a rehearsal into a
# reassuring lie.
#
# The load-bearing part for /play is the `gzip` block. Read `gzip_types` and
# notice what is *not* in it.

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    ##
    # Basic
    ##
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Alpine's mime.types has mapped .wasm to application/wasm since 1.21.4.
    # Debian 13 ships 1.26.x, which has it too. Asserted by the stage script
    # rather than trusted, because the failure is silent: application/octet-stream
    # makes `WebAssembly.instantiateStreaming` refuse the module.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    ##
    # Logging
    ##
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    ##
    # Gzip
    ##
    # Reproduced verbatim, and it is the reason /play is slow on this host:
    #
    #   - `application/wasm` is absent from gzip_types, so the 6.6 MB module is
    #     served raw. Every cold visit pays all of it.
    #   - there is no `gzip_static` and no `ngx_brotli` on this box at all, so
    #     the `.gz` and `.br` files `release-play.sh` emits next to the wasm are
    #     dead weight on disk — nginx never looks at them.
    #
    # Both are deliberate here. A staging container that quietly fixed them
    # would report a page twice as fast as the one visitors get.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    ##
    # Rate limiting zones
    ##
    limit_req_zone  $binary_remote_addr zone=general:10m rate=20r/s;
    limit_req_zone  $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=compass:10m rate=10r/m;
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    ##
    # TLS
    ##
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_dhparam /etc/nginx/tls/dhparam.pem;

    # DEVIATION: OCSP stapling is off. It needs a certificate with an OCSP
    # responder URL and a resolver that can reach it; the entrypoint's
    # self-signed cert has neither, and nginx logs a warning per worker on
    # every start. Stapling has no bearing on what the page is allowed to do.
    # ssl_stapling on;
    # ssl_stapling_verify on;
    resolver 1.1.1.1 9.9.9.9 valid=300s;
    resolver_timeout 5s;

    include /etc/nginx/conf.d/*.conf;
    include /etc/nginx/sites-enabled/*;
}
