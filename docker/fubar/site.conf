# The body of the fubarchitect vhost, shared by the :80 and :443 servers.
#
# Transcribed from webb's `vhost.conf.j2` (the `use_letsencrypt: true` branch,
# which is what actually runs — the HTTP-only branch carries no security
# headers at all and would rehearse nothing). Jinja variables are resolved from
# `ansible/group_vars/all.yml`:
#
#   static_root      -> /var/www/fubarchitect.com/public  (here: /srv/root)
#   app_proxy_path   -> /api/
#   app_port         -> 3000
#
# It is `include`d twice rather than written twice so the two listeners cannot
# drift apart and quietly rehearse different things.

# Security headers. Every location that sets an add_header of its own has to
# repeat all of these — see warez-vidiotic.conf for what that costs and why.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff"                                       always;
add_header X-Frame-Options           "DENY"                                          always;
add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()"      always;
add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:" always;

client_max_body_size 10m;
limit_conn addr 20;

location ^~ /.well-known/ {
    try_files $uri =404;
}

location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
}
location ~* \.(env|git|svn|htaccess|htpasswd)$ {
    deny all;
}

error_page 404 /404.html;
error_page 500 502 503 504 /500.html;

root  /srv/root;
index index.html;

# Basalt SPA — the precedent for a per-warez policy, and the reason the
# vidiotic block below looks the way it does.
location /warez/basalt/ {
    limit_req zone=general burst=40 nodelay;
    try_files $uri $uri/ =404;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                       always;
    add_header X-Frame-Options           "DENY"                                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"               always;
    add_header Permissions-Policy        "geolocation=(), camera=(), microphone=()"      always;
    add_header Content-Security-Policy   "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src data:; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'" always;
}

# The block under test. Swapped for an empty file when the stage script is run
# with --strict, which is how the three failures it fixes were established
# rather than assumed.
include /etc/nginx/fubar/warez-vidiotic.conf;

# Fixtures for the smoke test, and nothing production has or wants.
include /etc/nginx/fubar/staging-clips.conf;

location / {
    limit_req zone=general burst=40 nodelay;
    try_files $uri $uri/ =404;

    location ~* \.(css|js|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# The API is not part of this rehearsal — no Sinatra process here. The location
# is kept so its precedence against the warez blocks is the real one, and
# returns 502 exactly as production would with the unit stopped.
location /api/ {
    limit_req zone=api burst=20 nodelay;
    return 502;
}
