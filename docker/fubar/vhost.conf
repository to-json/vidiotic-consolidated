# fubarchitect.com, as it runs — two listeners over one shared body.
#
# ── The one deliberate departure from production ──────────────────────────────
#
# On the real box, :80 does nothing but answer ACME challenges and 301 to https.
# Here it serves the site, with the full production header set.
#
# That is not laziness, it is the only way the rehearsal is usable. WebGPU needs
# a secure context, and `http://localhost` is one by definition — but
# `https://localhost` with a self-signed certificate is not, until the browser
# is told to ignore certificate errors, which also suppresses other things worth
# seeing. So the smoke test drives :80 and still meets the real CSP, the real
# Permissions-Policy and the real cache rules, because the *headers* are what
# /play collides with and they are identical on both listeners.
#
# :443 exists anyway, with the same body, because `listen ssl` is a different
# code path in nginx and a config that loads on one can fail on the other.

server {
    listen 80;
    listen [::]:80;
    server_name fubarchitect.local localhost _;

    include /etc/nginx/fubar/site.conf;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fubarchitect.local localhost _;

    # Self-signed, minted by the entrypoint. Standing in for certbot's, which
    # this container has no way to obtain and nothing to learn from.
    ssl_certificate     /etc/nginx/tls/fubar.crt;
    ssl_certificate_key /etc/nginx/tls/fubar.key;

    include /etc/nginx/fubar/site.conf;
}
