# STAGING ONLY — not part of the production block.
#
# `play-smoke.mjs --url <base>` fetches its fixtures from `<base>/clips/`, so
# the rig has to put the repo's clips there. Production ships no clips: a
# visitor brings their own file and it never leaves their browser.
#
# Kept in its own file, included only by the staging site.conf, so that
# `warez-vidiotic.conf` stays something that can be pasted into vhost.conf.j2
# without reading it for things that must not go.
#
# The prefix is longer than /warez/vidiotic/, so it wins the match outright.
location /warez/vidiotic/clips/ {
    alias /srv/clips/;
    # Deliberately no add_header of any kind: these are fixtures, and adding one
    # here would discard the inherited set and make this path the odd one out in
    # exactly the way the real blocks are careful not to be.
    autoindex off;
}
