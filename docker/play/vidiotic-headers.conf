# Headers that must apply to every path the site serves.
#
# This file is the answer to nginx's add_header semantics: a location that sets
# any add_header of its own discards the whole inherited set, `always` included.
# Rather than repeat these in each generated location, the generated config
# includes `vidiotic-headers/*.conf` — resolved against nginx's own prefix,
# usually /etc/nginx — so one file covers every path.
#
# Representative rather than prescriptive: these are the headers a real
# deployment tends to carry, and they are here so the rehearsal reproduces what
# the real server does. Replace them with yours.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options SAMEORIGIN always;
add_header Strict-Transport-Security "max-age=31536000" always;
