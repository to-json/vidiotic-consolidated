# The server block around /play — the part an operator writes once.
#
# Everything that changes per build lives in the site's own nginx.conf, which
# release-play.sh generates into dist/play and this includes. That split is the
# whole idea: a redeploy renames the bundle directory, and nothing outside the
# artifact has to know.
#
# This file is what the real server's block should look like. If it works here
# and not there, the difference is in this file or in nginx's build, and both
# are things `nginx -T` and `nginx -V` will tell you.
#
# The security headers are here on purpose, and are not decoration. nginx's
# add_header *replaces* the inherited set rather than merging with it, so a
# location that sets Cache-Control drops every one of these for that path — the
# same class of silent, obviously-correct-looking bug as the types{} block. A
# rehearsal without them cannot see it. Putting them in the shared snippet the
# generated config includes is what makes them survive, and serve-play.sh
# asserts they do.

server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name localhost;

    ssl_certificate     /etc/nginx/play.crt;
    ssl_certificate_key /etc/nginx/play.key;

    root /srv/root;
    index index.html;

    # Applies where no location overrides it — and, via the snippet the
    # generated config includes, inside the locations that do.
    include vidiotic-headers/*.conf;

    # The generated, per-build half: cache policy for the hashed bundle, the
    # precompressed variants, and the one MIME override older nginx needs.
    include /srv/root/SITE_DIR/nginx.conf;

    location / {
        try_files $uri $uri/ =404;
    }

    # Test scaffolding, not part of a deployment. The smoke test fetches a real
    # clip from the page's own origin, the way the file picker would hand one
    # over; an alias keeps it out of the read-only artifact mount, which cannot
    # have another mount nested inside it.
    location /clips/ {
        alias /srv/clips/;
    }
}
