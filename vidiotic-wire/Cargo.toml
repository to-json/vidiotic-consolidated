[package]
name = "vidiotic-wire"
version = "0.1.0"
edition = "2021"

[lib]
name = "vidiotic_wire"

[features]
default = []
# Blocking client helper (connect + typed request/reply) for sibling tools
# (vidiotic-ctl, vidiotic-prep). The protocol types themselves are always built.
client = []

[dependencies]
nanoserde = "0.2"
# The ISF parameter model is re-exported rather than mirrored — see `isf.rs`.
# Default features off so the ffmpeg-backed thumbnailer in `clippool` never
# enters the wire crate. Neither wire's consumers (`vidiotic`, `vidiotic-prep`)
# are reachable from here, so this is cycle-free.
vidiotic-core = { path = "../vidiotic-core", default-features = false }

[lints.clippy]
use_self = "warn"
redundant_clone = "warn"
doc_markdown = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
semicolon_if_nothing_returned = "warn"
single_match_else = "warn"
